  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function paintStars(canvas, rng, count, minR, maxR) {
        var ctx = canvas.getContext("2d");
        var w = canvas.width;
        var h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        for (var i = 0; i < count; i++) {
          var x = rng() * w;
          var y = rng() * h;
          var r = minR + rng() * (maxR - minR);
          var roll = rng();
          var alpha = 0.28 + rng() * 0.62;
          var fill;
          if (roll < 0.06) {
            fill = "rgba(79,195,247," + alpha + ")";
          } else if (roll < 0.1) {
            fill = "rgba(255,209,102," + alpha + ")";
          } else {
            fill = "rgba(232,238,247," + alpha + ")";
          }
          ctx.fillStyle = fill;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      var rng = mulberry32(33033);
      paintStars(document.getElementById("scene-3-stars-far"), rng, 140, 0.55, 1.35);
      paintStars(document.getElementById("scene-3-stars-near"), rng, 48, 1.05, 2.15);

      var path = document.getElementById("scene-3-traj-path");
      var glow = document.getElementById("scene-3-traj-glow");
      var len = path.getTotalLength();
      path.style.strokeDasharray = String(len);
      path.style.strokeDashoffset = String(len);
      glow.style.strokeDasharray = String(len);
      glow.style.strokeDashoffset = String(len);

      var burnAt = len * 0.09;
      var burnPt = path.getPointAtLength(burnAt);
      var flame = document.getElementById("scene-3-flame");
      flame.style.left = burnPt.x - 9 + "px";
      flame.style.top = burnPt.y - 26 + "px";

      var counter = document.getElementById("scene-3-counter");
      var state = { value: 0 };
      var START_SCALE = 0.52;

      var tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#scene-3-stars-far",
        { x: 0 },
        { x: -32, duration: 8, ease: "none" },
        0
      );
      tl.fromTo(
        "#scene-3-stars-near",
        { x: 0 },
        { x: -84, duration: 8, ease: "none" },
        0
      );

      tl.fromTo(
        "#scene-3-earth",
        { opacity: 0, scale: 0.86 },
        { opacity: 1, scale: 1, duration: 0.85, ease: "power3.out" },
        0
      );
      tl.fromTo(
        "#scene-3-moon",
        { opacity: 0, scale: 0.86 },
        { opacity: 1, scale: 1, duration: 0.85, ease: "power3.out" },
        0.12
      );
      tl.fromTo(
        "#scene-3-earth-label",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.28
      );
      tl.fromTo(
        "#scene-3-moon-label",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.38
      );

      tl.fromTo(
        [path, glow],
        { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: 2.7, ease: "expo.out" },
        1.5
      );

      tl.fromTo(
        "#scene-3-flame",
        { opacity: 0, scale: 0.55 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        1.5
      );
      tl.fromTo(
        "#scene-3-burn-label",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        1.86
      );

      tl.fromTo(
        "#scene-3-dv-card",
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        4.2
      );
      tl.fromTo(
        ".scene-3-dv-kicker",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        4.2
      );
      tl.to(
        state,
        {
          value: 3.05,
          duration: 1.7,
          ease: "power3.out",
          onUpdate: function () {
            counter.textContent = (Math.round(state.value * 100) / 100).toFixed(2);

      tl.fromTo(

        { scale: START_SCALE },
        { scale: 1, duration: 1.7, ease: "power3.out" },
        4.35

      tl.fromTo(

        { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" },

      window.__timelines["scene-3"] = tl;
    })();
