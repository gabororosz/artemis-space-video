  <script>
    (function () {
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function paintStars(canvas, count, sizeMin, sizeMax, alphaMin, alphaMax, rng) {
        var ctx = canvas.getContext("2d");
        var w = canvas.width;
        var h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        for (var i = 0; i < count; i++) {
          var x = rng() * w;
          var y = rng() * h;
          var r = sizeMin + rng() * (sizeMax - sizeMin);
          var a = alphaMin + rng() * (alphaMax - alphaMin);
          var roll = rng();
          var fill;
          if (roll > 0.97) fill = "rgba(255, 209, 102, " + a + ")";
          else if (roll > 0.93) fill = "rgba(79, 195, 247, " + a + ")";
          else fill = "rgba(232, 238, 247, " + a + ")";
          ctx.fillStyle = fill;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function pad2(n) {
        return (n < 10 ? "0" : "") + n;
      }

      function formatTplus(sec) {
        var s = Math.round(sec);
        var hh = Math.floor(s / 3600);
        var mm = Math.floor((s % 3600) / 60);
        var ss = s % 60;
        return pad2(hh) + ":" + pad2(mm) + ":" + pad2(ss);
      }

      var rng = mulberry32(22022);
      paintStars(document.getElementById("scene-2-stars-far"), 140, 0.4, 1.15, 0.18, 0.55, rng);
      paintStars(document.getElementById("scene-2-stars-near"), 55, 1.1, 2.2, 0.45, 0.92, rng);

      var plumeIds = [
        "scene-2-plume-l",
        "scene-2-plume-bl",
        "scene-2-plume-c",
        "scene-2-plume-br",
        "scene-2-plume-r",
        "scene-2-plume-hot",
      ];
      plumeIds.forEach(function (id) {
        var p = document.getElementById(id);
        var len = p.getTotalLength() * 1.05;
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });

      var altEl = document.getElementById("scene-2-alt");
      var velEl = document.getElementById("scene-2-vel");
      var tplusEl = document.getElementById("scene-2-tplus");
      var textEl = document.getElementById("scene-2-annotation-text");
      var cursorEl = document.getElementById("scene-2-cursor");

      var COUNT_AT = 1.6;
      var COUNT_DUR = 2.4;
      var COUNT_EASE = "power3.out";
      var START_SCALE = 0.52;

      var alt = { value: 0 };
      var vel = { value: 0 };
      var tplus = { value: 0 };

      var SEQUENCE = [
        { t: 4.4, html: "" },
        { t: 4.55, html: '<span class="scene-2-annotation-gold">~24h</span>' },
        { t: 5.05, html: '<span class="scene-2-annotation-gold">~24h</span> elliptical orbit' },
        { t: 5.55, html: '<span class="scene-2-annotation-gold">~24h</span> elliptical orbit for system checkouts' },
      ];
      function textAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].html;
        }
        return "";
      }

      var tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#scene-2-stars-far",
        { x: 0 },
        { x: -22, duration: 8, ease: "power3.out" },
        0
      );
      tl.fromTo(
        "#scene-2-stars-near",
        { x: 0 },
        { x: -54, duration: 8, ease: "power3.out" },
        0
      );
      tl.fromTo(
        "#scene-2-camera .scene-2-camera",
        { scale: 1 },
        { scale: 1.045, duration: 8, ease: "power3.out" },
        0
      );

      tl.fromTo(
        "#scene-2-heading",
        { opacity: 0, x: -28 },
        { opacity: 1, x: 0, duration: 0.72, ease: "expo.out" },
        0
      );
      tl.fromTo(
        "#scene-2-rule",
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.48, ease: "power3.out" },
        0.16
      );
      tl.fromTo(
        "#scene-2-vehicle-wrap",
        { opacity: 0, y: 32 },
        { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" },
        0.1
      );

      var plumeStarts = [1.6, 1.76, 1.92, 2.08, 2.24, 2.12];
      plumeIds.forEach(function (id, i) {
        tl.fromTo(
          "#" + id,
          { strokeDashoffset: document.getElementById(id).getTotalLength() * 1.05 },
          { strokeDashoffset: 0, duration: i === 5 ? 1.7 : 1.85, ease: "power3.out" },
          plumeStarts[i]
        );
      });
      tl.fromTo(
        "#scene-2-ignition",
        { opacity: 0 },
        { opacity: 1, duration: 1.1, ease: "power3.out" },
        1.6
      );

      tl.fromTo(
        "#scene-2-telemetry-stack",
        { opacity: 0, x: 22 },
        { opacity: 1, x: 0, duration: 0.55, ease: "expo.out" },
        COUNT_AT
      );
      tl.fromTo(
        ".scene-2-stat-label",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.08 },
        COUNT_AT + 0.08
      );

      tl.fromTo(
        alt,
        { value: 0 },
        {
          value: 162,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () {
            altEl.textContent = Math.round(alt.value).toLocaleString();
          },
        },
        COUNT_AT
      );
      tl.fromTo("#scene-2-alt", { scale: START_SCALE }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);
      tl.fromTo(
        vel,
        { value: 0 },
        {
          value: 7.61,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () {
            velEl.textContent = vel.value.toFixed(2);
          },
        },
        COUNT_AT
      );
      tl.fromTo(
        tplus,
        { value: 0 },
        {
          value: 485,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () {
            tplusEl.textContent = formatTplus(tplus.value);
          },
        },
        COUNT_AT
      );

      tl.fromTo(
        "#scene-2-alt-suffix",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        COUNT_AT + COUNT_DUR
      );
      tl.fromTo(
        "#scene-2-vel-suffix",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        COUNT_AT + COUNT_DUR
      );

      tl.fromTo(
        "#scene-2-annotation-lockup",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        4.4
      );

      var driver = { t: 0 };
      var lastHtml = null;
      tl.fromTo(
        driver,
        { t: 0 },
        {
          t: 8,
          duration: 8,
          ease: "none",
          onUpdate: function () {
            var html = textAt(driver.t);
            if (html !== lastHtml) {
              textEl.innerHTML = html;
              lastHtml = html;
            }
          },
        },
        0
      );

      var blink = { p: 0 };
      tl.fromTo(
        blink,
        { p: 0 },
        {
          p: Math.PI * 2 * 6,
          duration: 3.6,
          ease: "none",
          onUpdate: function () {
            cursorEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
          },
        },
        4.4
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["scene-2"] = tl;
    })();
