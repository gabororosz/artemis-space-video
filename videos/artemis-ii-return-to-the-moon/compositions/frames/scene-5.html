    (function () {
      const DURATION = 10.432;

      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

      function paintStars(canvas, count, minR, maxR, alphaMin, alphaMax, rng) {
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, 1920, 1080);
        for (let i = 0; i < count; i++) {
          const x = rng() * 1920;
          const y = rng() * 1080;
          const r = minR + rng() * (maxR - minR);
          const a = alphaMin + rng() * (alphaMax - alphaMin);
          ctx.fillStyle = "rgba(232, 238, 247, " + a + ")";
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function prepPath(p) {
        const len = p.getTotalLength() * 1.05;
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
        return len;
      }

      const arcFar = root.querySelector("#scene-5-arc-far");

      const farLen = prepPath(arcFar);

      const words = root.querySelectorAll(".scene-5-word");

      const REST_LEVEL = 0.12;
      const MAX_BLUR = 36;

      const ACTIVE_RGB = { r: 79, g: 195, b: 247 };
      const BRAND_RGB = { r: 232, g: 238, b: 247 };

        closest: { start: 1.006, end: 1.33 },
        approach: { start: 1.34, end: 2.16 },
        dist: { start: 2.163, end: 3.599 },
        km: { start: 3.61, end: 4.062 },

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        const releaseEnd = end + RELEASE;

        return REST_LEVEL;

          ", " +
          lerpChannel(REST_RGB.g, target.g, env) +
          ", " +
          lerpChannel(REST_RGB.b, target.b, env) +
          ")"

        root.querySelector("#scene-5-ring"),
        { opacity: 0, scale: 1 },
        { opacity: 0.7, scale: 1, duration: 0.4, ease: "power3.out" },
        2.0,
      );
      tl.fromTo(
        root.querySelector("#scene-5-ring"),
        { scale: 1, opacity: 0.7 },
        {
          scale: 1.85,
          opacity: 0.18,
          duration: PULSE_DUR,
          yoyo: true,
          repeat: pulseRepeats,
          ease: "power3.out",
          immediateRender: false,
        },
        2.4,
      );

      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            words.forEach(function (el) {
              const timing = TIMINGS[el.dataset.word];
              if (!timing) return;
              const env = envelope(driver.t, timing.start, timing.end);
              const isBrand = el.classList.contains("scene-5-word-brand");
              el.style.textShadow = "0 0 " + MAX_BLUR * env + "px " + glowColorRgba(env, isBrand);
              el.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env) + ")";
              el.style.color = colorAt(env, isBrand);
            });
          },
        },
        0,
      );

      tl.fromTo(
        root.querySelector("#scene-5-stat"),
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        COUNT_AT,
      );
      tl.fromTo(
        root.querySelector("#scene-5-stat-label"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        COUNT_AT,
      );
      tl.to(
        countState,
        {
          value: TARGET_VALUE,
          duration: COUNT_DUR,
          ease: "expo.out",
          onUpdate: function () {
            counter.textContent = Math.round(countState.value).toLocaleString("en-US");
          },
        },
        COUNT_AT,
      );
      tl.fromTo(
        counter,
        { scale: START_SCALE },
        { scale: 1, duration: COUNT_DUR, ease: "expo.out" },
        COUNT_AT,
      );
      tl.fromTo(
        root.querySelector("#scene-5-suffix"),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        COUNT_AT + COUNT_DUR,
      );
      tl.fromTo(
        root.querySelector("#scene-5-stat-tag"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        5.54,
      );

      function nameIn(id, at) {
        tl.fromTo(
          root.querySelector(id),
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
          at,
        );
      }
      nameIn("#scene-5-name-wiseman", 7.2);
      nameIn("#scene-5-dot-1", 8.182);
      nameIn("#scene-5-name-glover", 8.182);
      nameIn("#scene-5-dot-2", 8.923);
      nameIn("#scene-5-name-koch", 8.923);
      nameIn("#scene-5-dot-3", 9.571);
      nameIn("#scene-5-name-hansen", 9.571);

      tl.to(
        [
          "#scene-5-name-wiseman",
          "#scene-5-dot-1",
          "#scene-5-name-glover",
          "#scene-5-dot-2",
          "#scene-5-name-koch",
          "#scene-5-dot-3",
          "#scene-5-name-hansen",
        ],
        { opacity: 0, duration: 0.4, ease: "power3.out" },
        10.55,
      );

      window.__timelines["scene-5"] = tl;
    })();
  </script>
</template>
